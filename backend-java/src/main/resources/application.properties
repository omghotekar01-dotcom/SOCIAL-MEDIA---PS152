spring.application.name=nexus-gateway
server.port=${NEXUS_JAVA_PORT:8080}

nexus.fastapi.base-url=${NEXUS_FASTAPI_BASE_URL:http://127.0.0.1:8000}
nexus.cors.origins=${NEXUS_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
spring.mvc.problemdetails.enabled=true
