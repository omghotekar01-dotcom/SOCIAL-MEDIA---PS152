<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NEXUS — evidence-aware social media analytics, narrative tracking, trend intelligence and link analysis for SIH26152." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f7fb" />
    <link rel="icon" type="image/svg+xml" href="/nexus.svg" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('nexus-theme');
          const theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', theme === 'dark' ? '#0b0e14' : '#f5f7fb');
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>NEXUS — Narrative & Influence Intelligence</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#162033;font-family:Inter,system-ui,sans-serif">
        <div style="display:grid;justify-items:center;gap:12px">
          <img src="/nexus.svg" alt="" width="48" height="48" style="border-radius:16px;box-shadow:0 16px 36px rgba(55,120,246,.22)" />
          <strong style="font-size:14px;letter-spacing:.14em">NEXUS</strong>
          <span style="font-size:10px;color:#8793a6">Loading analyst workspace…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
